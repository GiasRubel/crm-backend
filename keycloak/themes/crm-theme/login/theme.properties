# CRM Pro — Keycloak login theme
#
# parent=base (NOT "keycloak") on purpose: the "keycloak" parent drags in
# PatternFly, whose markup + CSS then has to be fought with !important on every
# rule. Inheriting from "base" means we own the markup: our own template.ftl and
# page templates, our own class names, one stylesheet, zero overrides.
#
# Templates we do not override (webauthn, recovery codes, x509, …) still fall
# back to base's markup — they render inside our template.ftl shell and pick up
# our design because every kc*Class property below is remapped to our classes.
parent=base
locales=en

styles=css/crm-theme.css
scripts=js/crm-theme.js

# ---------------------------------------------------------------- shell
kcHtmlClass=crm-html
kcBodyClass=crm-body
kcLoginClass=crm-shell
kcFormCardClass=crm-card
kcFormHeaderClass=crm-card__header
kcContentWrapperClass=crm-content

# ---------------------------------------------------------------- forms
kcFormClass=crm-form
kcFormGroupClass=crm-field
kcFormGroupErrorClass=crm-field--error
kcLabelWrapperClass=crm-label-wrap
kcLabelClass=crm-label
kcInputWrapperClass=crm-input-wrap
kcInputClass=crm-input
kcInputGroup=crm-input-group
kcInputErrorMessageClass=crm-field__error
kcInputHelperTextBeforeClass=crm-field__help
kcInputHelperTextAfterClass=crm-field__help
kcFormOptionsClass=crm-form-options
kcFormOptionsWrapperClass=crm-form-options__aside
kcFormButtonsClass=crm-form-actions
kcFormSettingClass=crm-form-settings
kcTextareaClass=crm-input crm-input--textarea

# checkboxes / radios (used by user-profile-commons + register-commons)
kcCheckboxInputClass=crm-check__input
kcInputClassRadio=crm-check
kcInputClassRadioInput=crm-check__input
kcInputClassRadioLabel=crm-check__label
kcInputClassCheckbox=crm-check
kcInputClassCheckboxInput=crm-check__input
kcInputClassCheckboxLabel=crm-check__label
kcInputClassRadioCheckboxLabelDisabled=crm-check__label--disabled

# password visibility toggle (js/crm-theme.js implements it)
kcFormPasswordVisibilityButtonClass=crm-reveal
kcFormPasswordVisibilityIconShow=crm-icon-eye
kcFormPasswordVisibilityIconHide=crm-icon-eye-off

# ---------------------------------------------------------------- buttons
kcButtonClass=crm-btn
kcButtonPrimaryClass=crm-btn--primary
kcButtonDefaultClass=crm-btn--ghost
kcButtonSecondaryClass=crm-btn--ghost
kcButtonBlockClass=crm-btn--block
kcButtonLargeClass=crm-btn--lg

# ---------------------------------------------------------------- feedback
kcAlertClass=crm-alert
kcAlertTitleClass=crm-alert__text
kcFeedbackSuccessIcon=crm-icon crm-icon--success
kcFeedbackWarningIcon=crm-icon crm-icon--warning
kcFeedbackErrorIcon=crm-icon crm-icon--error
kcFeedbackInfoIcon=crm-icon crm-icon--info
kcResetFlowIcon=crm-icon crm-icon--reset

# ---------------------------------------------------------------- footer / info
kcSignUpClass=crm-footnote
kcInfoAreaWrapperClass=crm-footnote__inner

# ---------------------------------------------------------------- social
kcFormSocialAccountSectionClass=crm-social
kcFormSocialAccountListClass=crm-social__list
kcFormSocialAccountListGridClass=crm-social__list--grid
kcFormSocialAccountListButtonClass=crm-social__btn
kcFormSocialAccountGridItem=crm-social__btn--grid
kcFormSocialAccountNameClass=crm-social__name
kcCommonLogoIdP=crm-social__icon

# ---------------------------------------------------------------- OTP list
kcLoginOTPListClass=crm-otp-option
kcLoginOTPListInputClass=crm-otp-option__input
kcLoginOTPListItemHeaderClass=crm-otp-option__header
kcLoginOTPListItemIconBodyClass=crm-otp-option__icon
kcLoginOTPListItemIconClass=crm-icon crm-icon--key
kcLoginOTPListItemTitleClass=crm-otp-option__title

# ---------------------------------------------------------------- authenticator picker
kcSelectAuthListClass=crm-choice-list
kcSelectAuthListItemClass=crm-choice
kcSelectAuthListItemFillClass=crm-choice__fill
kcSelectAuthListItemIconPropertyClass=crm-choice__icon
kcSelectAuthListItemIconClass=crm-choice__icon
kcSelectAuthListItemBodyClass=crm-choice__body
kcSelectAuthListItemHeadingClass=crm-choice__title
kcSelectAuthListItemDescriptionClass=crm-choice__desc
kcSelectAuthListItemArrowClass=crm-choice__arrow
kcSelectAuthListItemArrowIconClass=crm-icon crm-icon--chevron

# ---------------------------------------------------------------- locale switcher
kcLocaleMainClass=crm-locale
kcLocaleWrapperClass=crm-locale__wrap
kcLocaleDropDownClass=crm-locale__dropdown
kcLocaleListClass=crm-locale__list
kcLocaleListItemClass=crm-locale__item
kcLocaleItemClass=crm-locale__link
